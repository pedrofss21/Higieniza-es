<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Higienizações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

    <h1>Higienizações</h1>

    <!-- Botão de tema -->
    <button id="toggleTheme" class="theme-btn">🌙 Modo Escuro</button>

    <!-- Formulário -->
    <form id="form">

      <input type="date" id="data" required>

      <!-- SERVIÇO EM BOTÕES -->
      <div class="grupo-servico">
        <label>Serviço:</label>
        <button type="button" class="btn-servico" data-servico="Polimento">Polimento</button>
        <button type="button" class="btn-servico" data-servico="Higienização">Higienização</button>
      </div>

      <!-- Campo oculto para salvar -->
      <input type="hidden" id="servico" required>

      <!-- TIPO DO VEÍCULO EM BOTÕES -->
      <div class="grupo-tipo">
        <label>Tipo do veículo:</label>
        <button type="button" class="btn-tipo" data-tipo="Novo">Novo</button>
        <button type="button" class="btn-tipo" data-tipo="Semi-novo">Semi-novo</button>
      </div>

      <!-- Campo oculto -->
      <input type="hidden" id="tipoVeiculo" required>

      <!-- Comissão automática -->
      <p id="previewComissao">Comissão: R$ 0,00</p>

      <input type="text" id="placa" placeholder="Placa ou Chassi" required>

      <button type="submit" class="add-btn">Adicionar</button>
    </form>

    <!-- Filtros e ações -->
    <div class="acoes">
      <input type="month" id="mesSelecionado">
      <button id="gerarPDF">Gerar PDF</button>
    </div>

    <!-- Resumo -->
    <div class="comissoes">
      <p>Total de carros: <span id="totalCarros">0</span></p>
      <p>Total em comissões: R$ <span id="totalComissao">0</span></p>
    </div>

    <!-- Tabela -->
    <table id="tabela">
      <thead>
        <tr>
          <th>Data</th>
          <th>Serviço</th>
          <th>Tipo</th>
          <th>Placa/Chassi</th>
          <th>Comissão</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </main>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
